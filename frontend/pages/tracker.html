<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Time Tracker</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="font-sans bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="bg-white p-5 w-full max-w-md rounded-2xl shadow-lg">

    <!-- Header -->
    <div class="text-center mb-5">
      <h2 class="text-2xl font-bold text-gray-800">Welcome</h2>
      <h2 id="username" class="text-2xl font-bold text-gray-800"></h2>
    </div>

    <!-- Dropdowns -->
    <div class="flex gap-2 mb-5">
      <select
        class="flex-1 h-9 rounded-lg border border-gray-300 px-3 text-sm bg-white shadow-sm focus:outline-none focus:border-gray-600">
        <option value="">Project</option>
      </select>

      <select
        class="flex-1 h-9 rounded-lg border border-gray-300 px-3 text-sm bg-white shadow-sm focus:outline-none focus:border-gray-600">
        <option value="">Task</option>
      </select>

      <select
        class="flex-1 h-9 rounded-lg border border-gray-300 px-3 text-sm bg-white shadow-sm focus:outline-none focus:border-gray-600">
        <option value="">Timesheet</option>
        <option value="">Create timesheet</option>
      </select>
    </div>

    <!-- Controls -->
    <div class="flex justify-around gap-3 mb-5">
      <button
        id="start"
        class="w-20 h-20 rounded-full bg-green-200 border border-gray-700 font-bold shadow-md
               hover:-translate-y-0.5 hover:shadow-lg transition">
        Start
      </button>

      <button
        id="pause"
        class="w-20 h-20 rounded-full bg-yellow-200 border border-gray-700 font-bold shadow-md
               hover:-translate-y-0.5 hover:shadow-lg transition">
        Pause
      </button>

      <button
        id="stop"
        class="w-20 h-20 rounded-full bg-red-200 border border-gray-700 font-bold shadow-md
               hover:-translate-y-0.5 hover:shadow-lg transition">
        Stop
      </button>
    </div>

    <!-- Timer -->
    <div
      id="timer"
      class="mb-5 bg-white p-4 text-3xl text-center rounded-xl shadow-inner font-mono">
      00:00:00
    </div>

    <!-- Screenshots -->
    <h4 class="block text-gray-700 font-medium mb-2">Screenshot Preview</h4>
    <div id="screenshots" class="flex flex-wrap gap-2">
      <!-- images injected here -->
    </div>

  </div>

  <!-- Scripts -->
  <script src="../js/renderer.js"></script>
  <script src="../js/profile.js"></script>

</body>
</html>
